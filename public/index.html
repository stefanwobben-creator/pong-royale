<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PONG ROYALE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='30' fill='%2300e5ff'/%3E%3C/svg%3E">
</head>
<body>

<canvas id="fx"></canvas>

<div id="netBanner" class="netbanner hidden"></div>

<!-- ======================= HOME ======================= -->
<section id="home" class="screen active">
  <div class="logo">
    <div class="logo-line">PONG</div>
    <div class="logo-line accent">ROYALE</div>
    <div class="tagline">laatste peddel die staat, wint</div>
  </div>

  <div class="card">
    <label class="lbl" for="codeInput">1. Typ de code van het spel</label>
    <input id="codeInput" class="inp code" maxlength="4" placeholder="&#183;&#183;&#183;&#183;"
           autocomplete="off" spellcheck="false" autocapitalize="characters"
           autocorrect="off" enterkeyhint="go">

    <label class="lbl" for="nameInput">2. Hoe heet je?</label>
    <input id="nameInput" class="inp" maxlength="12" placeholder="Jouw naam"
           autocomplete="off" spellcheck="false" enterkeyhint="go">

    <button id="btnJoin" class="btn primary">Meedoen</button>
    <div id="homeErr" class="err"></div>
  </div>

  <button id="btnCreate" class="btn ghost host">Ik ben de host: nieuw spel starten</button>

  <div class="foot">Werkt op elke telefoon. Geen app, geen account.</div>
</section>

<!-- ======================= LOBBY ======================= -->
<section id="lobby" class="screen">
  <div class="lobby-head">
    <div class="lbl">Deze code typen ze in</div>
    <div id="lobbyCode" class="bigcode">----</div>
    <div class="lobby-actions">
      <button id="btnShare" class="btn tiny">Uitnodiging kopieren</button>
      <button id="btnQR" class="btn tiny ghost">QR-code</button>
    </div>
    <div id="qrWrap" class="qr hidden"><div id="qr"></div><div class="qr-url" id="qrUrl"></div></div>
  </div>

  <div id="shareBox" class="sharebox"></div>

  <div class="lbl spread">Spelers <span id="playerCount"></span></div>
  <div id="playerList" class="players"></div>

  <div class="lobby-foot">
    <div class="colors" id="colorPicker"></div>
    <div id="botRow" class="botrow hidden">
      <select id="botLevel" class="inp small">
        <option value="0">Makkelijk</option>
        <option value="1" selected>Normaal</option>
        <option value="2">Sterk</option>
      </select>
      <button id="btnAddBot" class="btn tiny">+ Oefenbot</button>
    </div>
    <button id="btnStart" class="btn primary">Start het potje</button>
    <div id="startHint" class="hint"></div>
    <button id="btnLeave" class="btn ghost tiny">Verlaten</button>
  </div>
</section>

<!-- ======================= GAME ======================= -->
<section id="game" class="screen">
  <canvas id="board"></canvas>

  <div class="hud-top">
    <div id="hudName" class="hud-name"></div>
    <div id="hudLives" class="hud-lives"></div>
    <button id="btnSound" class="soundbtn" aria-label="geluid">&#9835;</button>
  </div>

  <div id="hypeWrap" class="hype">
    <div id="hypeBar" class="hype-bar"></div>
    <span class="hype-lbl">HYPE</span>
  </div>

  <div id="bigText" class="bigtext"></div>
  <div id="toast" class="toast"></div>

  <!-- supporter panel, shown after you are knocked out -->
  <div id="supportPanel" class="support hidden">
    <div class="support-head">Je ligt eruit. Kies wie je steunt:</div>
    <div id="supportList" class="support-list"></div>
    <button id="btnCheer" class="cheer hidden">JUICH!</button>
    <div class="support-hint">Blijf tappen. Vol = jouw held wordt <b>SUPERCHARGED</b>.</div>
  </div>
</section>

<!-- ======================= CEREMONY ======================= -->
<section id="over" class="screen">
  <canvas id="ceremony"></canvas>
  <div class="over-ui">
    <div class="over-title">KAMPIOEN</div>
    <div id="champName" class="champ-name"></div>
    <div id="champSub" class="champ-sub"></div>
    <div id="podiumStats" class="stats"></div>
    <button id="btnAgain" class="btn primary">Nog een potje</button>
    <button id="btnHome" class="btn ghost tiny">Naar begin</button>
  </div>
</section>

<script src="game.js"></script>
<script src="app.js"></script>
</body>
</html>
